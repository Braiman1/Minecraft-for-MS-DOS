[sdl]
fullscreen=false
output=surface
[dosbox]
machine=vgaonly
memsize=6
[cpu]
core=normal
cputype=pentium_slow
cycles=fixed 50000
[mixer]
nosound=true
[midi]
mpu401=none
[sblaster]
sbtype=none
[gus]
gus=false
[speaker]
pcspeaker=false
[autoexec]
# Run from dos/build/dos, or mount that directory before executing these commands.
mount c .
c:
cwsdpmi -p -s-
mcdos --test
if errorlevel 1 goto fail
mcdos --smoke
if errorlevel 1 goto fail
echo PASS > EXIT.TXT
goto finish
:fail
echo FAIL > EXIT.TXT
:finish
exit
